<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEMSKOR - Etkinlik Kurulumu</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body data-page="setup">
    <header class="header">
      <div class="header-top">
        <div class="header-left">
          <h1>MEMSKOR</h1>
          <div class="event-status" id="event-status">
            <span class="status-indicator" id="status-indicator"></span>
            <span id="event-name-display">Etkinlik yükleniyor...</span>
            <span class="event-phase" id="event-phase"></span>
            <span class="event-datetime" id="event-datetime"></span>
          </div>
        </div>
        <div id="user-info" class="user-info">
          <span id="current-user"></span>
          <span id="user-role"></span>
        </div>
      </div>
      <div class="header-bottom">
        <div class="event-switcher">
          <label>
            <select id="event_selector"></select>
          </label>
          <button id="new_event" class="btn-small">Yeni</button>
          <button id="delete_event" class="btn-small danger">Sil</button>
        </div>
        <div class="actions">
          <button id="save-event" class="btn-small">Etkinliği Kaydet</button>
          <a href="/dashboard" class="button btn-small">Dashboard</a>
          <a href="/logout" class="button btn-small">Çıkış</a>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="card">
          <h2>Kurulum Adımları</h2>
          <div class="setup-progress">
            <div class="progress-bar-container">
              <div class="progress-bar" id="setup-progress-bar">
                <div class="progress-fill" id="setup-progress-fill"></div>
              </div>
              <span class="progress-text" id="setup-progress-text">0%</span>
            </div>
            <div class="progress-summary" id="setup-progress-summary">
              <span id="completed-steps">0</span> / <span id="total-steps">12</span> adım tamamlandı
            </div>
          </div>
          <ol id="setup-steps" class="steps"></ol>
          <div class="match-control-ready" id="match-control-ready" style="display: none;">
            <div class="ready-indicator">
              <span class="ready-icon">✓</span>
              <span class="ready-text">Maç Kontrol Sayfasına Hazır</span>
            </div>
            <button id="go-to-match-control" class="button btn-small" style="margin-top: 8px; width: 100%;">
              Maç Kontrol Sayfasına Git
            </button>
          </div>
        </div>
      </aside>

      <div class="content" id="step-content">
        <!-- İçerik buraya dinamik olarak yüklenecek -->
        <div class="card" style="padding: 32px; text-align: center; color: #666;">
          <p>Yükleniyor...</p>
        </div>
      </div>
    </main>

    <!-- Modüller (sıralama önemli) -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/constants.js"></script>
    <script src="/static/js/network_utils.js"></script>
    <script src="/static/js/event.js"></script>
    <script src="/static/js/teams.js"></script>
    <script src="/static/js/users.js"></script>
    <script src="/static/js/inspection.js"></script>
    <script src="/static/js/practice_matches.js"></script>
    <script src="/static/js/match_schedule.js"></script>
    <script src="/static/js/awards.js"></script>
    <script src="/static/js/wifi.js"></script>
    <script src="/static/js/archive.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/setup_validation.js"></script>
    <script src="/static/js/setup.js"></script>
    <!-- Ana dosya (en son yüklenmeli) -->
    <script src="/static/app.js"></script>
  </body>
</html>
