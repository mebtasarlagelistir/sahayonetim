<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEMSKOR - Etkinlik Kurulumu</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="header">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
        <h1 style="margin: 0;">MEMSKOR - Etkinlik Kurulumu</h1>
        <div id="user-info" style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: #666;">
          <span id="current-user" style="font-weight: 500;"></span>
          <span id="user-role" style="background: #e1e4ee; padding: 4px 8px; border-radius: 4px; font-size: 12px;"></span>
        </div>
      </div>
      <div class="event-switcher">
        <label>
          Aktif Etkinlik
          <select id="event_selector"></select>
        </label>
        <button id="new_event">Yeni Etkinlik</button>
        <button id="delete_event" class="danger">Etkinliği Sil</button>
      </div>
      <div class="actions">
        <button id="save-event">Etkinliği Kaydet</button>
        <button id="save-teams">Takımları Kaydet</button>
        <a href="/logout" class="button" style="margin-left: auto;">Çıkış Yap</a>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="card">
          <h2>Kurulum Adımları</h2>
          <ol id="setup-steps" class="steps"></ol>
        </div>
      </aside>

      <div class="content" id="step-content">
        <!-- İçerik buraya dinamik olarak yüklenecek -->
        <div class="card" style="padding: 32px; text-align: center; color: #666;">
          <p>Yükleniyor...</p>
        </div>
      </div>
    </main>

    <!-- Modüller (sıralama önemli) -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/event.js"></script>
    <script src="/static/js/teams.js"></script>
    <script src="/static/js/users.js"></script>
    <script src="/static/js/inspection.js"></script>
    <script src="/static/js/practice_matches.js"></script>
    <script src="/static/js/match_schedule.js"></script>
    <script src="/static/js/setup.js"></script>
    <!-- Ana dosya (en son yüklenmeli) -->
    <script src="/static/app.js"></script>
  </body>
</html>
