<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEMSKOR - Giriş</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="login-container">
      <section class="card login-card">
        <h2>Giriş</h2>
        <p class="placeholder">Varsayılan: admin / admin123</p>
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login" class="login-form">
          <label>Kullanıcı Adı <input name="username" type="text" /></label>
          <label>Şifre <input name="password" type="password" /></label>
          <button type="submit">Giriş Yap</button>
        </form>
        <div class="login-links">
          <a href="/audience?new=1" class="button btn-small">Seyirci Ekranını Aç</a>
        </div>
      </section>
    </main>
  </body>
</html>
