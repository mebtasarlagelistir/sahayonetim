<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEMSKOR - Pit Yönetimi</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .pit-wrap { max-width: 1100px; margin: 0 auto; padding: 12px; }
      .pit-summary { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
      .pit-stat { background: #f1f4fb; border-radius: 10px; padding: 8px 14px; font-weight: 700; color: #1d4ed8; }
      .pit-stat span { color: #0f172a; }
      .pit-toolbar { display: flex; gap: 8px; align-items: center; margin: 10px 0 16px; flex-wrap: wrap; }
      .pit-toolbar input { flex: 1; min-width: 200px; padding: 12px; font-size: 16px; border: 1px solid #cbd5f5; border-radius: 8px; }
      .pit-card { border: 1px solid #e1e4ee; border-radius: 12px; padding: 14px; margin-bottom: 12px; background: #fff; box-shadow: 0 4px 12px rgba(15,23,42,0.06); }
      .pit-card.is-in { border-left: 6px solid #1a9e3a; }
      .pit-card.is-out { border-left: 6px solid #cbd5f5; }
      .pit-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
      .pit-team-no { font-size: 20px; font-weight: 800; color: #0f172a; }
      .pit-team-name { color: #475569; font-weight: 600; }
      .pit-team-school { color: #94a3b8; font-size: 13px; }
      .pit-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      .pit-btn { min-height: 44px; padding: 8px 14px; border-radius: 8px; border: 0; font-weight: 700; cursor: pointer; font-size: 15px; }
      .pit-btn.in-yes { background: #1a9e3a; color: #fff; }
      .pit-btn.in-no { background: #e2e8f0; color: #334155; }
      .pit-btn.cert-yes { background: #1d4ed8; color: #fff; }
      .pit-btn.cert-no { background: #fde68a; color: #92400e; }
      .pit-meta { font-size: 12px; color: #64748b; margin-left: 4px; }
      .pit-lost { margin-top: 10px; }
      .pit-lost h4 { margin: 4px 0; font-size: 13px; color: #475569; }
      .pit-lost-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: #fff7ed; margin: 4px 0; }
      .pit-lost-row.resolved { background: #f0fdf4; color: #166534; text-decoration: line-through; opacity: 0.8; }
      .pit-lost-add { display: flex; gap: 6px; margin-top: 6px; }
      .pit-lost-add input { flex: 1; min-height: 40px; padding: 8px; border: 1px solid #cbd5f5; border-radius: 6px; }
      .pit-notes { width: 100%; min-height: 56px; margin-top: 10px; padding: 8px; border: 1px solid #cbd5f5; border-radius: 8px; font-size: 15px; font-family: inherit; }
      .pit-empty { text-align: center; color: #94a3b8; padding: 32px; }
    </style>
  </head>
  <body data-page="pit-admin">
    <header class="header">
      <div class="header-top">
        <div class="header-left">
          <h1>MEMSKOR — Pit Yönetimi</h1>
          <div class="event-status"><span id="pit_event_name">Etkinlik</span></div>
        </div>
      </div>
    </header>

    <main class="pit-wrap">
      <div class="pit-summary" id="pit_summary"></div>
      <div class="pit-toolbar">
        <input id="pit_search" type="text" placeholder="🔎 Takım ara (numara veya ad)" />
        <button id="pit_refresh" class="btn-secondary">Yenile</button>
      </div>
      <div id="pit_list"><div class="pit-empty">Yükleniyor...</div></div>
    </main>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/network_utils.js"></script>
    <script src="/static/js/pit_admin.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
