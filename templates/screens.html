<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MEMSKOR - Seyirci Ekranları</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body data-page="screens">
    <header class="header">
      <div class="header-top">
        <div class="header-left">
          <h1>MEMSKOR</h1>
          <div class="event-status" id="event-status">
            <span class="status-indicator" id="status-indicator"></span>
            <span id="event-name-display">Etkinlik yükleniyor...</span>
            <span class="event-phase" id="event-phase"></span>
            <span class="event-datetime" id="event-datetime"></span>
          </div>
        </div>
        <div id="user-info" class="user-info">
          <span id="current-user"></span>
          <span id="user-role"></span>
        </div>
      </div>
      <div class="header-bottom">
        <div class="event-switcher">
          <label>
            <select id="event_selector"></select>
          </label>
          <button id="new_event" class="btn-small">Yeni</button>
          <button id="delete_event" class="btn-small danger">Sil</button>
        </div>
        <div class="actions">
          <a href="/dashboard" class="button btn-small">Dashboard</a>
          <a href="/match-control" class="button btn-small">Maç Kontrol</a>
          <a href="/logout" class="button btn-small">Çıkış</a>
        </div>
      </div>
    </header>

    <main class="screens-layout">
      <!-- Global Ayarlar Panel -->
      <section class="screens-global-panel">
        <div class="panel-header">
          <div class="panel-icon">📺</div>
          <div>
            <h2>Global Ekran Ayarları</h2>
            <p class="panel-subtitle">Tüm ekranlar için varsayılan görünüm</p>
          </div>
        </div>
        
        <div class="global-settings-grid">
          <div class="setting-card">
            <label class="setting-label">
              <span class="label-icon">🎬</span>
              Aktif Görünüm
            </label>
            <div class="custom-select-wrapper">
              <select id="screen_active_view" class="custom-select">
                <option value="match">⚽ Maç Ekranı</option>
                <option value="inspection">🔍 İnceleme Durumu</option>
                <option value="rankings">🏆 Sıralama Puanları</option>
                <option value="playoff">🏆 Playoff Bracket (Çift Eleme)</option>
                <option value="awards">🌟 Ödüller (Tüm Kazananlar)</option>
                <option value="ceremony">🎉 Ödül Töreni</option>
              </select>
            </div>
          </div>
          
          <div class="setting-card">
            <label class="setting-label">
              <span class="label-icon">📝</span>
              Overlay Metni
            </label>
            <input type="text" id="screen_overlay_text" class="overlay-input" placeholder="Örn: Hoş geldiniz" />
          </div>
          
          <div class="setting-card toggle-card">
            <label class="toggle-label">
              <input type="checkbox" id="screen_overlay_enabled" class="toggle-input" />
              <span class="toggle-switch"></span>
              <span class="toggle-text">Overlay Göster</span>
            </label>
          </div>
        </div>
        
        <div class="global-actions">
          <button id="save_screen_settings" class="btn-action btn-primary-gradient">
            <span class="btn-icon">✔</span>
            Ayarları Uygula
          </button>
          <a href="/audience?new=1" target="_blank" class="btn-action btn-secondary-outline">
            <span class="btn-icon">+</span>
            Yeni Ekran Aç
          </a>
        </div>
      </section>

      <!-- Bağlı Ekranlar Panel -->
      <section class="screens-connected-panel">
        <div class="panel-header">
          <div class="panel-icon">🖥️</div>
          <div>
            <h2>Bağlı Ekranlar</h2>
            <p class="panel-subtitle" id="screens_count">Yükleniyor...</p>
          </div>
          <button class="btn-refresh" onclick="loadConnectedScreens()" title="Yenile">
            🔄
          </button>
        </div>
        
        <div id="connected_screens_list" class="screens-grid">
          <div class="loading-spinner">
            <div class="spinner"></div>
            <span>Ekranlar yükleniyor...</span>
          </div>
        </div>
      </section>
    </main>

    <script src="/static/js/utils.js"></script>
    <script src="/static/js/constants.js"></script>
    <script src="/static/js/network_utils.js"></script>
    <script src="/static/js/event.js"></script>
    <script src="/static/js/users.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/screens.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
